name: Supabase Keep Alive

on:
  schedule:
    
    - cron: '17 5 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase via RPC (con reintentos)
        run: |
          max_intentos=4
          espera=10

          for intento in $(seq 1 $max_intentos); do
            echo "Intento $intento de $max_intentos"

            response=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
              --max-time 30 \
              -X POST "https://fdhvhdctuhckmdbzjcvf.supabase.co/rest/v1/rpc/validar_certificado" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"p_codigo": "PING-KEEPALIVE"}') || response=000
            response=${response:-000}

            echo "HTTP status: $response"
            cat /tmp/response.txt 2>/dev/null; echo

            if [ "$response" -ge 200 ] && [ "$response" -lt 400 ]; then
              echo "Ping exitoso"
              exit 0
            fi

            if [ "$intento" -lt "$max_intentos" ]; then
              echo "Falló, reintentando en ${espera}s..."
              sleep $espera
              espera=$((espera * 2))
            fi
          done

          echo "El ping falló tras $max_intentos intentos"
          exit 1

      - name: Mantener activo el repo
        if: always()
        run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive $(date -u +%F)"
          git push
